<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}RoadVision — Context-Aware Road Intelligence{% endblock %}</title>

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" />

    <!-- RoadVision Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gradient-dark">

    <!-- ================================================================
         NAVBAR
         ================================================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass sticky-top py-2 px-3">
        <div class="container-fluid">
            <!-- Brand Logo & Title -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <div class="brand-icon-box">
                    <i class="bi bi-eye-fill text-amber"></i>
                </div>
                <div>
                    <span class="brand-title">RoadVision</span>
                    <span class="brand-subtitle d-none d-sm-inline">VisionX Scene Intelligence</span>
                </div>
            </a>

            <!-- Header Right: System Status Indicator -->
            <div class="d-flex align-items-center gap-3 ms-auto">
                <div class="status-pill d-flex align-items-center gap-2 px-3 py-1 rounded-pill">
                    <span class="pulse-dot green" id="status-pulse"></span>
                    <span class="status-text fw-bold" id="status-badge">SYSTEM READY</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- ================================================================
         MAIN CONTENT
         ================================================================ -->
    <main class="container-fluid py-4 px-lg-4">
        {% block content %}{% endblock %}
    </main>

    <!-- ================================================================
         FOOTER
         ================================================================ -->
    <footer class="footer-glass py-3 mt-auto border-top border-secondary-subtle">
        <div class="container-fluid d-flex flex-column flex-sm-row align-items-center justify-content-between text-muted small px-lg-4">
            <div>
                <strong class="text-light">RoadVision</strong> &bull; VisionX Hackathon 2026
            </div>
            <div class="text-muted text-center text-sm-end mt-1 mt-sm-0">
                <em>From Object Detection to Context-Aware Road-Scene Understanding</em>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- RoadVision JS -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
