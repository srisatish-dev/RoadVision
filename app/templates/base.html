<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}RoadVision{% endblock %}</title>

    <!-- Bootstrap CSS (CDN — local copy can be added for offline use) -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />

    <!-- RoadVision Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- ================================================================
         NAVBAR
         ================================================================ -->
    <nav class="navbar navbar-dark navbar-roadvision">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                🚗 RoadVision
                <small class="text-muted fs-6 ms-2">Context-Aware Road Scene Intelligence</small>
            </span>
            <span class="badge bg-secondary ms-auto" id="status-badge">IDLE</span>
        </div>
    </nav>

    <!-- ================================================================
         MAIN CONTENT
         ================================================================ -->
    <main class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </main>

    <!-- ================================================================
         FOOTER
         ================================================================ -->
    <footer class="footer-roadvision text-center py-2 mt-auto">
        <small class="text-muted">
            RoadVision &mdash; VisionX Hackathon &mdash;
            <em>From object detection to context-aware road-scene understanding.</em>
        </small>
    </footer>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Chart.js (for optional visualizations) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- RoadVision JS -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>

<!--
NOTE: This is a STUB template.
Full implementation of the dashboard begins in Phase 2 (Web Application Phase).
-->
